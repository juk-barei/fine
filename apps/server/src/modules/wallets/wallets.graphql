type WalletListItem {
  address: String!
  score: Float
  band: String
  confidence: String
  labelTier: String
  decisionStatus: String
  lastAnalysed: String
}

type WalletPage {
  nodes: [WalletListItem!]!
  total: Int!
}

extend type Query {
  wallets(limit: Int, offset: Int, status: String): WalletPage!
  wallet(address: String!): WalletDetail
}

type WalletGraphNode {
  id: ID!
  label: String!
  band: String!
  tier: String!
  subject: Boolean!
  hops: Int!
}

type WalletGraphEdge {
  from: ID!
  to: ID!
  amountUsdt: Float!
  txHash: String!
  timestamp: String!
}

type WalletGraph {
  nodes: [WalletGraphNode!]!
  edges: [WalletGraphEdge!]!
}

type WalletDetail {
  wallet: WalletListItem!
  flags: [String!]!
  simulated: Boolean!
  graph: WalletGraph
}

type WalletScreening {
  wallet: WalletListItem!
  flags: [String!]!
  simulated: Boolean!
  graph: WalletGraph!
}

extend type Mutation {
  screenWallet(address: String!): WalletScreening!
}
